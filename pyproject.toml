[tool.poetry]
name = "metadatax"
version = "0.6.4"
description = "PAM acquisition metadata"
authors = ["Your Name <you@example.com>"]
license = "GPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
Django = ">=5.2,<5.3"
djangorestframework = "^3.16"
django-filter = ">=2"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.10"
django-model-prefix = "^1.1.0"
graphene-django = "^3.2.3"
graphene-django-pagination = { url = "https://github.com/instruct-br/graphene-django-pagination/archive/master.zip" }
django-admin-multiple-choice-list-filter = "^0.1.1"
django-better-admin-arrayfield = "^1.4.2"
django-durationwidget = "^1.0.5"
graphene-django-optimizer = "^0.10.0"
#django-extension = { path = "../django-extension", develop = true }
django-extension = { url = "https://github.com/Project-OSmOSE/django-extension/archive/refs/tags/v1.0.0.tar.gz" }

[tool.poetry.group.dev.dependencies]
drf-yasg = "^1.21.7"
drf-spectacular = "^0.27.2"
black = "^22.10.0"

[tool.poetry.group.prod.dependencies]
gunicorn = "^23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
